# Configuración de deploy en Netlify para el sitio de Mice Rice (Angular 21)

[build]
  command = "npm run build"
  publish = "dist/mice-rice-site/browser"

# Los fuentes de Wollok no tienen MIME type conocido: los servimos como texto UTF-8.
# Las imágenes (.png) y sonidos (.ogg/.mp3/.wav) de public/game ya salen con su MIME correcto.
[[headers]]
  for = "/game/*.wlk"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/game/*.wpgm"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# SPA: cualquier ruta la resuelve el router de Angular.
# Sin `force = true`, Netlify sirve primero los archivos que existen (todo /game/** y
# /game/lib/game-index.js incluidos) y solo cae a index.html cuando no hay archivo.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
